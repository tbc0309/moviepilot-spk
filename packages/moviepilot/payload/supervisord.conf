[unix_http_server]
file=/var/packages/MoviePilot/target/moviepilot/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
childlogdir=/var/packages/MoviePilot/target/logs
logfile=/var/packages/MoviePilot/target/logs/supervisord.log
pidfile=/var/packages/MoviePilot/target/moviepilot/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/packages/MoviePilot/target/moviepilot/supervisor.sock

[program:moviepilot]
directory=/var/packages/MoviePilot/target/moviepilot
command=/var/packages/MoviePilot/target/bin/python3.14 app/main.py
autostart=true
autorestart=true
startsecs=5
startretries=3
priority=10
stopsignal=TERM
stopwaitsecs=20
killasgroup=true
stopasgroup=true
redirect_stderr=true

[program:moviepilot-web]
directory=/var/packages/MoviePilot/target/public
command=/var/packages/Node.js_v22/target/usr/local/bin/node /var/packages/MoviePilot/target/public/service.js
autostart=true
autorestart=true
startsecs=3
startretries=3
priority=20
stopsignal=TERM
stopwaitsecs=20
killasgroup=true
stopasgroup=true
redirect_stderr=true
stdout_logfile=/var/packages/MoviePilot/target/logs/node-service.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
